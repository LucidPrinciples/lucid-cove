<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookkeeping">
<link rel="apple-touch-icon" href="/static/lp-mark.png">
<link rel="icon" type="image/png" href="/static/lp-mark.png">
<title>Bookkeeping</title>
<style>
:root{
  --bg:#0a0a0f; --surface:#12121a; --border:#2a2a3a; --text:#e8e8f0;
  --dim:#9898b0; --faint:#6a6a80; --accent:#5ce1e6; --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  height:100%;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:16px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
header h1{font-size:1.05rem;font-weight:600;letter-spacing:.02em}
header .meta{font-size:.78rem;color:var(--dim);margin-top:4px}
.bk-close{position:fixed;top:10px;left:12px;z-index:50;width:36px;height:36px;border-radius:18px;
  border:1px solid #333;background:#1a1a2e;color:#e0e0e0;font-size:18px;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
body.bk-show-close .bk-close{display:flex}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;
  border-bottom:1px solid var(--border);flex-shrink:0}
select,button,input{font:inherit}
select,input{background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px}
input{min-width:0}
button{background:transparent;border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{border-color:var(--accent);color:var(--accent);background:rgba(92,225,230,.1)}
button:disabled{opacity:.45;cursor:not-allowed}
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px;flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.card .k{font-size:.72rem;color:var(--dim)}
.card .v{font-size:1.05rem;font-weight:600;margin-top:2px}
.card.ok .v{color:var(--ok)} .card.bad .v{color:var(--bad)}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:#16161f;color:var(--dim);font-weight:500;font-size:.75rem;letter-spacing:.04em}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#16161f}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.pill{display:inline-block;font-size:.7rem;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}
.err{margin:16px;padding:14px;border-radius:10px;border:1px solid rgba(248,113,113,.35);
  background:rgba(248,113,113,.08);color:var(--bad)}
.okmsg{color:var(--ok);font-size:.82rem}
.detail-bar,.map-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.detail-bar h2,.map-bar h2{font-size:.95rem;font-weight:600;flex:1}
.line-row select{max-width:220px}
.status{padding:6px 16px;font-size:.8rem;color:var(--dim);flex-shrink:0}
.hide{display:none}
#pnlView,#detailView,#mapView{flex:1;min-height:0;flex-direction:column}
#pnlView{display:flex}
#pnlView.hide,#detailView.hide,#mapView.hide{display:none}
.sec-head td{padding-top:18px;padding-bottom:6px;font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);background:var(--bg)}
.sec-total td{font-weight:600;border-bottom:none;padding-top:8px}
.map-add{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.map-add input{flex:1;min-width:140px}
.map-add select{flex:1;min-width:160px}
.check{width:18px;height:18px;accent-color:var(--accent)}
.batch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.add-line{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
.add-line input[type="date"]{width:150px}
.add-line input.amt{width:110px}
.add-line input.payee{flex:1;min-width:140px}
.add-line textarea{width:100%;min-height:90px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;resize:vertical}
.line-row.off td{opacity:.45}
.line-row.off td:last-child{opacity:1}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.acts button{padding:4px 8px;font-size:.78rem}
</style>
</head>
<body>
<button class="bk-close" type="button" aria-label="Close">×</button>
<header>
  <h1>Bookkeeping</h1>
  <div class="meta" id="hdrMeta">Loading…</div>
</header>
<div class="toolbar">
  <label class="faint">Book
    <select id="bookSel"></select>
  </label>
  <label class="faint">Ledger
    <select id="ledgerSel"></select>
  </label>
  <label class="faint">Period
    <select id="periodSel"></select>
  </label>
  <button type="button" id="btnAll">All time</button>
  <button type="button" id="btnTx">Transactions</button>
  <button type="button" id="btnMap">Import map</button>
  <button type="button" class="primary" id="btnAdd">Add line</button>
  <button type="button" id="btnPaste">Paste rows</button>
</div>
<div id="err" class="err hide"></div>
<div class="add-line" id="addLineBar">
  <input id="newDate" type="date">
  <input id="newPayee" class="payee" type="text" placeholder="Payee" autocomplete="off">
  <input id="newAmt" class="amt" type="text" inputmode="decimal" placeholder="Amount">
  <select id="newCat"></select>
  <button type="button" class="primary" id="btnAddLine">Save line</button>
</div>
<div class="add-line" id="pasteBar" style="display:none;flex-direction:column;align-items:stretch">
  <textarea id="pasteText" rows="5" placeholder="Paste copied statement rows here. They stay on this page — not in chat."></textarea>
  <div class="batch">
    <label class="faint"><input type="checkbox" class="check" id="pasteIncome"> These are income / 1099 receipts</label>
    <button type="button" class="primary" id="btnPasteSave">Add pasted rows</button>
  </div>
</div>
<div id="pnlView">
  <div class="totals">
    <div class="card ok"><div class="k">Income</div><div class="v" id="tInc">—</div></div>
    <div class="card bad"><div class="k">Expenses</div><div class="v" id="tExp">—</div></div>
    <div class="card"><div class="k">Net</div><div class="v" id="tNet">—</div></div>
    <div class="card"><div class="k">Owner Loan</div><div class="v" id="tLoan">—</div></div>
  </div>
  <div class="scroll">
    <table>
      <thead><tr><th>Category</th><th class="num">Count</th><th class="num">Total</th></tr></thead>
      <tbody id="pnlBody"></tbody>
    </table>
  </div>
</div>
<div id="detailView" class="hide" style="display:none;flex-direction:column;flex:1;min-height:0">
  <div class="detail-bar">
    <button type="button" id="btnBack">← P&amp;L</button>
    <h2 id="detailTitle">Category</h2>
    <span class="pill" id="detailCount"></span>
  </div>
  <div class="detail-bar batch">
    <label class="faint"><input type="checkbox" class="check" id="chkAll"> All</label>
    <select id="batchCat"></select>
    <button type="button" class="primary" id="btnApply">Apply to checked</button>
  </div>
  <div class="scroll">
    <table>
      <thead><tr><th></th><th>Date</th><th>Account</th><th>Payee</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody id="lineBody"></tbody>
    </table>
  </div>
</div>
<div id="mapView" class="hide" style="display:none;flex-direction:column;flex:1;min-height:0">
  <div class="map-bar">
    <button type="button" id="btnMapBack">← P&amp;L</button>
    <h2>Import map</h2>
    <span class="pill" id="mapCount"></span>
  </div>
  <div class="map-add">
    <input id="mapPhrase" type="text" placeholder="Vendor or phrase" autocomplete="off">
    <select id="mapCat"></select>
    <button type="button" class="primary" id="btnAddRule">Add / update</button>
    <button type="button" id="btnSeed">Fill from placed</button>
  </div>
  <div class="scroll">
    <table>
      <thead><tr><th>Phrase</th><th>Category</th><th>Source</th><th></th></tr></thead>
      <tbody id="mapBody"></tbody>
    </table>
  </div>
</div>
<div class="status" id="status"></div>
<script>
const $ = (id) => document.getElementById(id);
const state = { path: 'all', book: 'chords', books: [], chart: [], year: null, month: null, periods: {years:[], months:[]}, category: null, vendorMap: [], ledgers: [] };

function money(n) {
  if (n == null || Number.isNaN(n)) return '—';
  const v = Number(n);
  const sign = v < 0 ? '−' : '';
  return sign + '$' + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function showErr(msg) {
  const el = $('err');
  if (!msg) { el.classList.add('hide'); el.textContent = ''; return; }
  el.textContent = msg;
  el.classList.remove('hide');
}
function leaveBooks() {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.closeFlowOverlay === 'function') {
      window.parent.closeFlowOverlay();
      return;
    }
  } catch (e) {}
  if (history.length > 1) history.back();
  else location.href = '/';
}
function qs() {
  const p = new URLSearchParams();
  if (state.path) p.set('path', state.path);
  if (state.book) p.set('book', state.book);
  if (state.year) p.set('year', String(state.year));
  if (state.month) p.set('month', String(state.month));
  const s = p.toString();
  return s ? ('?' + s) : '';
}
function fillBooks() {
  const sel = $('bookSel');
  if (!sel) return;
  const list = state.books && state.books.length ? state.books : [
    {id:'all-books', label:'All books'},
    {id:'chords', label:'Chords of Truth, LLC'},
    {id:'pickleball', label:'Pickleball'},
    {id:'personal', label:'Personal'}
  ];
  sel.innerHTML = list.map(item => {
    const id = item.id || item;
    const label = item.label || id;
    return `<option value="${escapeHtml(id)}">${escapeHtml(label)}</option>`;
  }).join('');
  sel.value = state.book || 'chords';
}
function fillLedgers() {
  const sel = $('ledgerSel');
  const list = state.ledgers || [];
  if (!list.length) {
    sel.innerHTML = '<option value="all">All Transactions</option>';
    sel.value = 'all';
    return;
  }
  sel.innerHTML = list.map(item => {
    const path = (item && item.path) ? item.path : String(item);
    const label = (item && item.label) ? item.label : (String(path).split('/').pop() || path);
    return `<option value="${escapeHtml(path)}">${escapeHtml(label)}</option>`;
  }).join('');
  sel.value = state.path || 'all';
}
function fillPeriod() {
  const sel = $('periodSel');
  const cur = state.year ? (state.month ? `${state.year}-${String(state.month).padStart(2,'0')}` : String(state.year)) : '';
  const opts = ['<option value="">All time</option>'];
  (state.periods.years || []).forEach(y => {
    opts.push(`<option value="${y}">${y}</option>`);
  });
  (state.periods.months || []).forEach(m => {
    const key = `${m.year}-${String(m.month).padStart(2,'0')}`;
    const label = new Date(m.year, m.month - 1, 1).toLocaleString(undefined, {month:'short', year:'numeric'});
    opts.push(`<option value="${key}">${label}</option>`);
  });
  sel.innerHTML = opts.join('');
  sel.value = cur;
}
function chartKind(item) {
  if (item && (item.kind === 'income' || item.kind === 'expense' || item.kind === 'transfer')) return item.kind;
  const lab = String((item && item.label) || '').toLowerCase();
  if (!lab) return 'expense';
  if (lab.includes('owner loan') || lab.includes('shareholder loan') || lab.includes('due to owner') || lab.includes('due from owner')) return 'transfer';
  if (lab.includes('gross receipts') || lab.includes('gross sales') || lab.includes('other income') || lab.includes('returns and allowance') || lab.includes('income')) return 'income';
  return 'expense';
}
function chartOptions(selected) {
  const items = state.chart || [];
  const income = [];
  const expense = [];
  const transfer = [];
  items.forEach(c => {
    const kind = chartKind(c);
    if (kind === 'income') income.push(c);
    else if (kind === 'transfer') transfer.push(c);
    else expense.push(c);
  });
  const opt = (c) => {
    const lab = escapeHtml(c.label);
    const sel = (selected && selected === c.label) ? ' selected' : '';
    return `<option value="${lab}"${sel}>${lab}</option>`;
  };
  const parts = [];
  if (income.length) parts.push('<optgroup label="Income">' + income.map(opt).join('') + '</optgroup>');
  if (expense.length) parts.push('<optgroup label="Expenses">' + expense.map(opt).join('') + '</optgroup>');
  if (transfer.length) parts.push('<optgroup label="Transfers">' + transfer.map(opt).join('') + '</optgroup>');
  return parts.join('') || items.map(opt).join('');
}
function hideViews() {
  $('pnlView').classList.add('hide');
  $('detailView').style.display = 'none';
  $('mapView').style.display = 'none';
}
function showPasteBar(on) {
  const bar = $('pasteBar');
  if (!bar) return;
  bar.style.display = on ? 'flex' : 'none';
}
function showAddBar(on) {
  const bar = $('addLineBar');
  if (!bar) return;
  bar.style.display = on ? 'flex' : 'none';
  if (on) showPasteBar(false);
}
function showPnl() {
  state.category = null;
  hideViews();
  showAddBar(true);
  $('pnlView').classList.remove('hide');
}
function showDetail() {
  hideViews();
  showAddBar(true);
  $('detailView').style.display = 'flex';
}
function showMap() {
  hideViews();
  showAddBar(false);
  showPasteBar(false);
  $('mapView').style.display = 'flex';
  renderMap();
}
async function loadSummary() {
  showErr('');
  $('status').textContent = 'Loading…';
  const r = await fetch('/api/books/summary' + qs());
  const data = await r.json();
  if (!data.ok) { showErr(data.error || 'Could not load books'); $('status').textContent = ''; return; }
  state.path = data.path || state.path;
  state.chart = data.chart || [];
  state.periods = data.periods || {years:[], months:[]};
  state.vendorMap = data.vendor_map || state.vendorMap;
  state.ledgers = data.ledgers || state.ledgers;
  state.books = data.books || state.books;
  if (data.filing_book) state.book = data.filing_book;
  fillBooks();
  fillLedgers();
  fillPeriod();
  const ent = data.filing_book_label || data.entity || 'Books';
  const acct = data.account || '';
  const review = data.needs_review_count != null ? ` · ${data.needs_review_count} need review` : '';
  const mapN = (state.vendorMap || []).length;
  $('hdrMeta').textContent = `${ent}${acct ? ' · ' + acct : ''} · ${data.row_count || 0} lines · ${mapN} map rules${review}`;
  if (data.seeded) {
    $('status').innerHTML = `<span class="okmsg">Filled ${data.seeded} map rules from placed lines</span>`;
  }
  const pnl = data.pnl || {};
  $('tInc').textContent = money(pnl.income_total);
  $('tExp').textContent = money(pnl.expense_total);
  $('tNet').textContent = money(pnl.net);
  if ($('tLoan')) $('tLoan').textContent = money(pnl.transfer_total);
  const rows = [];
  rows.push(sectionHead('Income'));
  if ((pnl.income || []).length) {
    pnl.income.forEach(line => rows.push(pnlRow(line, 'income')));
  } else {
    rows.push(emptyRow('No income in this period'));
  }
  rows.push(sectionTotal('Total income', pnl.income_total, 'ok'));
  rows.push(sectionHead('Expenses'));
  if ((pnl.expenses || []).length) {
    pnl.expenses.forEach(line => rows.push(pnlRow(line, 'expense')));
  } else {
    rows.push(emptyRow('No expenses in this period'));
  }
  rows.push(sectionTotal('Total expenses', pnl.expense_total, 'bad'));
  if ((pnl.transfers || []).length) {
    rows.push(sectionHead('Transfers'));
    pnl.transfers.forEach(line => rows.push(pnlRow(line, 'transfer')));
    rows.push(sectionTotal('Transfers', pnl.transfer_total, ''));
  }
  if (pnl.uncategorized && pnl.uncategorized.count) {
    rows.push(sectionHead('Uncategorized'));
    rows.push(pnlRow(pnl.uncategorized, 'uncat'));
  }
  rows.push(sectionTotal('Net', pnl.net, ''));
  $('pnlBody').innerHTML = rows.join('');
  if (!data.seeded) $('status').textContent = '';
  $('batchCat').innerHTML = chartOptions();
  $('mapCat').innerHTML = chartOptions();
  if ($('newCat')) $('newCat').innerHTML = chartOptions();
  if ($('newDate') && !$('newDate').value) $('newDate').value = new Date().toISOString().slice(0,10);
}
function sectionHead(label) {
  return `<tr class="sec-head"><td colspan="3">${escapeHtml(label)}</td></tr>`;
}
function sectionTotal(label, amount, cls) {
  return `<tr class="sec-total"><td>${escapeHtml(label)}</td><td></td><td class="num ${cls}">${money(amount)}</td></tr>`;
}
function emptyRow(label) {
  return `<tr><td colspan="3" class="muted">${escapeHtml(label)}</td></tr>`;
}
function pnlRow(line, kind) {
  const cls = kind === 'expense' ? 'bad' : (kind === 'income' ? 'ok' : '');
  const label = escapeHtml(line.label || 'Uncategorized');
  return `<tr class="clickable" data-cat="${encodeURIComponent(line.label || 'Uncategorized')}">
    <td>${label}${kind==='uncat' ? ' <span class="pill">place these</span>' : ''}</td>
    <td class="num muted">${line.count || 0}</td>
    <td class="num ${cls}">${money(line.total)}</td>
  </tr>`;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function openCategory(label) {
  state.category = label;
  $('detailTitle').textContent = (label === '*' ? 'Transactions' : label);
  showDetail();
  if ($('newCat')) $('newCat').innerHTML = chartOptions();
  if ($('newDate') && !$('newDate').value) $('newDate').value = new Date().toISOString().slice(0,10);
  $('lineBody').innerHTML = '<tr><td colspan="7" class="muted">Loading…</td></tr>';
  const p = new URLSearchParams();
  if (state.path) p.set('path', state.path);
  if (state.book) p.set('book', state.book);
  if (state.year) p.set('year', String(state.year));
  if (state.month) p.set('month', String(state.month));
  p.set('category', label);
  const r = await fetch('/api/books/lines?' + p.toString());
  const data = await r.json();
  if (!data.ok) { $('lineBody').innerHTML = `<tr><td colspan="7">${escapeHtml(data.error || 'Error')}</td></tr>`; return; }
  state.chart = data.chart || state.chart;
  $('detailCount').textContent = (data.count || 0) + ' lines';
  $('batchCat').innerHTML = chartOptions();
  const opts = chartOptions();
  const body = (data.lines || []).map(line => {
    const src = escapeHtml(line.source_path || state.path || '');
    const sel = `<select data-index="${line.index}" data-source="${src}" data-was="${escapeHtml(line.category)}"${line.disabled ? ' disabled' : ''}>${opts}</select>`;
    const off = line.disabled ? ' off' : '';
    const pill = line.disabled ? ' <span class="pill">off</span>' : (line.manual ? ' <span class="pill">typed</span>' : '');
    const toggle = `<button type="button" data-act="toggle" data-index="${line.index}" data-source="${src}" data-off="${line.disabled ? '1' : '0'}">${line.disabled ? 'Restore' : 'Disable'}</button>`;
    const remove = line.manual ? `<button type="button" data-act="remove" data-index="${line.index}" data-source="${src}">Remove</button>` : '';
    return `<tr class="line-row${off}">
      <td><input type="checkbox" class="check line-check" data-index="${line.index}" data-source="${src}" ${line.disabled ? 'disabled' : ''}></td>
      <td class="muted">${escapeHtml(line.date || '')}</td>
      <td class="muted">${escapeHtml(line.account || '')}${pill}</td>
      <td>${escapeHtml(line.payee || '')}</td>
      <td>${sel}</td>
      <td class="num ${line.amount < 0 ? 'bad' : 'ok'}">${money(line.amount)}</td>
      <td class="acts">${toggle}${remove}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="muted">No lines.</td></tr>';
  $('lineBody').innerHTML = body;
  $('chkAll').checked = false;
  $('lineBody').querySelectorAll('select').forEach(sel => {
    sel.value = sel.getAttribute('data-was') || '';
    sel.addEventListener('change', () => saveLine(sel));
  });
}
function checkedItems() {
  return Array.from(document.querySelectorAll('.line-check:checked')).map(el => ({
    index: Number(el.getAttribute('data-index')),
    source_path: el.getAttribute('data-source') || state.path
  }));
}
async function saveLine(sel) {
  const index = Number(sel.getAttribute('data-index'));
  const source_path = sel.getAttribute('data-source') || state.path;
  const category = sel.value;
  $('status').textContent = 'Saving…';
  const r = await fetch('/api/books/line', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ path: source_path, source_path, index, category })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Save failed');
    sel.value = sel.getAttribute('data-was') || '';
    return;
  }
  sel.setAttribute('data-was', category);
  if (data.vendor_map) state.vendorMap = data.vendor_map;
  $('status').innerHTML = '<span class="okmsg">Saved · map updated</span>';
  await loadSummary();
  if (state.category) await openCategory(state.category);
}
async function applyChecked() {
  const items = checkedItems();
  const category = $('batchCat').value;
  if (!items.length) { showErr('Check the lines you want to move'); return; }
  if (!category) { showErr('Pick a category'); return; }
  showErr('');
  $('status').textContent = 'Saving…';
  const r = await fetch('/api/books/lines', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ items, category })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Save failed');
    return;
  }
  if (data.vendor_map) state.vendorMap = data.vendor_map;
  $('status').innerHTML = `<span class="okmsg">Placed ${data.updated || items.length} · map updated</span>`;
  await loadSummary();
  if (state.category) await openCategory(state.category);
}
function renderMap() {
  const rules = state.vendorMap || [];
  $('mapCount').textContent = rules.length + ' rules';
  $('mapCat').innerHTML = chartOptions();
  $('mapBody').innerHTML = rules.map((rule, i) => `
    <tr>
      <td>${escapeHtml(rule.phrase)}</td>
      <td>${escapeHtml(rule.label)}</td>
      <td class="muted">${escapeHtml(rule.source || '')}</td>
      <td><button type="button" data-del="${i}">Remove</button></td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="muted">No rules yet. Fill from placed lines, recode a payee, or add one here.</td></tr>';
}
async function saveMap(rules) {
  $('status').textContent = 'Saving map…';
  const r = await fetch('/api/books/map', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ path: state.path, vendor_map: rules, apply: true })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Map save failed');
    return;
  }
  state.vendorMap = data.vendor_map || rules;
  $('status').innerHTML = `<span class="okmsg">Map saved${data.applied ? ' · placed ' + data.applied : ''}</span>`;
  renderMap();
  await loadSummary();
}
$('pnlBody').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-cat]');
  if (!tr) return;
  openCategory(decodeURIComponent(tr.getAttribute('data-cat')));
});
$('btnBack').onclick = () => { showPnl(); loadSummary(); };
$('btnMapBack').onclick = () => { showPnl(); loadSummary(); };
$('btnMap').onclick = () => { showMap(); };
$('btnTx').onclick = () => { openCategory('*'); };
$('btnAdd').onclick = () => {
  if ($('mapView').style.display === 'flex') showPnl();
  showPasteBar(false);
  showAddBar(true);
  $('newPayee').focus();
};
$('btnPaste').onclick = () => {
  if ($('mapView').style.display === 'flex') showPnl();
  showAddBar(false);
  showPasteBar(true);
  $('pasteText').focus();
};
async function addPastedRows() {
  const text = ($('pasteText').value || '').trim();
  if (!text) { showErr('Paste the copied rows on this page'); return; }
  showErr('');
  $('status').textContent = 'Adding pasted rows…';
  const r = await fetch('/api/books/lines/paste', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      text,
      filing_book: state.book === 'all-books' ? 'pickleball' : state.book,
      year: state.year || 2025,
      income: $('pasteIncome').checked
    })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Paste failed');
    return;
  }
  $('pasteText').value = '';
  $('status').innerHTML = `<span class="okmsg">Added ${data.added || 0} line${data.added === 1 ? '' : 's'}</span>`;
  await loadSummary();
  await openCategory(state.category || '*');
}
$('btnAll').onclick = () => { state.year = null; state.month = null; fillPeriod(); loadSummary(); };
$('ledgerSel').onchange = () => {
  state.path = $('ledgerSel').value || 'all';
  showPnl();
  loadSummary();
};
$('bookSel').onchange = () => {
  state.book = $('bookSel').value || 'chords';
  showPnl();
  loadSummary();
};
async function seedFromPlaced() {
  showErr('');
  $('status').textContent = 'Filling map from placed lines…';
  const r = await fetch('/api/books/seed-map', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ path: state.path, apply: true })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Seed failed');
    return;
  }
  state.vendorMap = data.vendor_map || state.vendorMap;
  $('status').innerHTML = `<span class="okmsg">Filled ${data.seeded || 0} · map now ${ (state.vendorMap || []).length } rules${data.applied ? ' · placed ' + data.applied : ''}</span>`;
  renderMap();
  await loadSummary();
}
$('btnSeed').onclick = seedFromPlaced;
$('periodSel').onchange = () => {
  const v = $('periodSel').value;
  if (!v) { state.year = null; state.month = null; }
  else if (v.includes('-')) {
    const [y,m] = v.split('-');
    state.year = Number(y); state.month = Number(m);
  } else { state.year = Number(v); state.month = null; }
  loadSummary();
};
$('chkAll').onchange = () => {
  document.querySelectorAll('.line-check').forEach(el => { el.checked = $('chkAll').checked; });
};
$('btnApply').onclick = applyChecked;
async function addTypedLine() {
  const date = ($('newDate').value || '').trim();
  const payee = ($('newPayee').value || '').trim();
  const amount = ($('newAmt').value || '').trim();
  const category = $('newCat').value || '';
  if (!date || !payee || !amount) { showErr('Date, payee, and amount are required'); return; }
  showErr('');
  $('status').textContent = 'Adding…';
  const r = await fetch('/api/books/line', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ date, payee, amount, category, filing_book: state.book === 'all-books' ? 'chords' : state.book })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Add failed');
    return;
  }
  $('newPayee').value = '';
  $('newAmt').value = '';
  $('status').innerHTML = '<span class="okmsg">Line added</span>';
  await loadSummary();
  await openCategory(state.category || '*');
}
async function setLineDisabled(btn) {
  const index = Number(btn.getAttribute('data-index'));
  const source_path = btn.getAttribute('data-source') || state.path;
  const disabled = btn.getAttribute('data-off') !== '1';
  $('status').textContent = disabled ? 'Disabling…' : 'Restoring…';
  const r = await fetch('/api/books/line/state', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ path: source_path, source_path, index, disabled })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Update failed');
    return;
  }
  $('status').innerHTML = `<span class="okmsg">${disabled ? 'Disabled' : 'Restored'}</span>`;
  await loadSummary();
  if (state.category) await openCategory(state.category);
}
async function removeTypedLine(btn) {
  const index = Number(btn.getAttribute('data-index'));
  const source_path = btn.getAttribute('data-source') || state.path;
  $('status').textContent = 'Removing…';
  const r = await fetch('/api/books/line', {
    method: 'DELETE',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ path: source_path, source_path, index })
  });
  const data = await r.json();
  if (!data.ok) {
    $('status').textContent = '';
    showErr(data.error || 'Remove failed');
    return;
  }
  $('status').innerHTML = '<span class="okmsg">Removed</span>';
  await loadSummary();
  if (state.category) await openCategory(state.category);
}
$('btnAddLine').onclick = addTypedLine;
$('btnPasteSave').onclick = addPastedRows;
$('lineBody').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  if (btn.getAttribute('data-act') === 'toggle') setLineDisabled(btn);
  if (btn.getAttribute('data-act') === 'remove') removeTypedLine(btn);
});
$('btnAddRule').onclick = () => {
  const phrase = ($('mapPhrase').value || '').trim();
  const label = $('mapCat').value;
  if (!phrase) { showErr('Enter a vendor or phrase'); return; }
  const next = (state.vendorMap || []).filter(r => r.phrase !== phrase.toLowerCase());
  next.push({ phrase, label, source: 'operator' });
  $('mapPhrase').value = '';
  saveMap(next);
};
$('mapBody').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-del]');
  if (!btn) return;
  const i = Number(btn.getAttribute('data-del'));
  const next = (state.vendorMap || []).filter((_, idx) => idx !== i);
  saveMap(next);
});
document.querySelector('.bk-close').onclick = leaveBooks;
(function initClose() {
  try {
    const inOverlay = window.parent && window.parent !== window;
    const want = new URLSearchParams(location.search).get('return');
    if (inOverlay || want === 'links') document.body.classList.add('bk-show-close');
  } catch (e) {}
})();
loadSummary();
</script>
</body>
</html>
